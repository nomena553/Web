<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomena Services — Solutions Digitales Madagascar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080808;--surface:#111;--surface2:#181818;--surface3:#1e1e1e;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --accent:#ff4500;--accent2:#00d4ff;--accent3:#a855f7;
  --text:#f2efe9;--text-muted:#555;--text-dim:#888;
  --font-d:'Syne',sans-serif;--font-m:'DM Mono',monospace;
  --r:12px;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--font-d);overflow-x:hidden;cursor:none;}

/* CURSOR */
#cur{position:fixed;width:10px;height:10px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .2s,height .2s;}
#cur2{position:fixed;width:36px;height:36px;border:1px solid rgba(255,69,0,.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all .12s ease;}

/* NOISE */
body::after{content:'';position:fixed;inset:0;z-index:9000;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.02;pointer-events:none;}

/* SCROLLBAR */
.sb{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:8999;width:0%;transition:width .08s;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:800;padding:20px 52px;display:flex;justify-content:space-between;align-items:center;background:rgba(8,8,8,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
.nav-brand-icon{width:38px;height:38px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));}
.nav-brand-name{font-size:14px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--text);}
.nav-brand-name span{color:var(--accent);}
.nav-links{display:flex;gap:36px;list-style:none;}
.nav-links a{font-family:var(--font-m);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;transition:color .3s;position:relative;}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--accent);transition:width .3s;}
.nav-links a:hover{color:var(--text);}
.nav-links a:hover::after{width:100%;}
.nav-open{display:flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#22c55e;border:1px solid rgba(34,197,94,.25);padding:6px 14px;}
.open-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* HERO */
#hero{min-height:100vh;display:flex;align-items:center;padding:0 52px;padding-top:90px;position:relative;overflow:hidden;}
.hero-bg-grid{position:absolute;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:72px 72px;animation:gridpulse 8s ease-in-out infinite alternate;}
@keyframes gridpulse{from{opacity:.4;}to{opacity:1;}}
.hero-glow{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse 70% 55% at 65% 35%,rgba(255,69,0,.07) 0%,transparent 65%),radial-gradient(ellipse 45% 45% at 15% 80%,rgba(0,212,255,.04) 0%,transparent 55%);}
.hero-content{position:relative;z-index:1;max-width:980px;}
.hero-eyebrow{font-family:var(--font-m);font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;display:flex;align-items:center;gap:14px;}
.hero-eyebrow::before{content:'';display:block;width:44px;height:1px;background:var(--accent);}
.hero-name{font-size:clamp(1rem,.5rem + 3vw,1.1rem);font-family:var(--font-m);letter-spacing:.3em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
h1{font-size:clamp(3rem,8vw,7.5rem);font-weight:800;line-height:.9;letter-spacing:-.03em;margin-bottom:28px;}
h1 .outline{color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.2);}
h1 .fire{color:var(--accent);}
.hero-sub{font-family:var(--font-m);font-size:14px;line-height:1.9;color:var(--text-dim);max-width:500px;margin-bottom:20px;}
.hero-open-banner{display:inline-flex;align-items:center;gap:10px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);padding:10px 20px;margin-bottom:40px;}
.hero-open-banner span{font-family:var(--font-m);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#22c55e;}
.hero-cta{display:flex;gap:16px;flex-wrap:wrap;}
.btn-wa{padding:15px 32px;background:#25D366;color:#fff;font-family:var(--font-d);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:10px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));transition:transform .2s,filter .2s;position:relative;overflow:hidden;}
.btn-wa::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.12);transform:translateX(-100%);transition:transform .3s;}
.btn-wa:hover::before{transform:translateX(0);}
.btn-wa:hover{transform:translateY(-2px);filter:brightness(1.1);}
.btn-mail{padding:15px 32px;background:transparent;color:var(--text);border:1px solid var(--border2);font-family:var(--font-d);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:10px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));transition:border-color .3s,color .3s,transform .2s;}
.btn-mail:hover{border-color:var(--accent2);color:var(--accent2);transform:translateY(-2px);}
.wa-icon,.mail-icon{width:18px;height:18px;flex-shrink:0;}

/* MARQUEE */
.mq-wrap{overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:16px 0;background:var(--surface);}
.mq-inner{display:flex;width:max-content;gap:56px;animation:mqroll 22s linear infinite;}
.mq-item{font-family:var(--font-m);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:18px;white-space:nowrap;}
.mq-dot{color:var(--accent);font-size:16px;}
@keyframes mqroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* SECTION BASE */
section{padding:110px 52px;}
.sec-label{font-family:var(--font-m);font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.sec-label::before{content:'';display:block;width:22px;height:1px;background:var(--accent);}
h2{font-size:clamp(2rem,4.5vw,3.8rem);font-weight:800;line-height:1;letter-spacing:-.025em;}

/* ===== SERVICES ANIMATED GRID ===== */
#services{background:var(--bg);}
.srv-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:70px;gap:32px;flex-wrap:wrap;}
.srv-header p{font-family:var(--font-m);font-size:13px;color:var(--text-muted);max-width:260px;line-height:1.8;}

.srv-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  background:var(--border);
  border:1px solid var(--border);
}

/* CARD ANIMATIONS */
.srv-card{
  background:var(--bg);
  padding:44px 36px 36px;
  position:relative;overflow:hidden;
  cursor:pointer;
  transition:background .35s;
  animation:cardIn .6s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.srv-card:nth-child(1){animation-delay:.05s;}
.srv-card:nth-child(2){animation-delay:.1s;}
.srv-card:nth-child(3){animation-delay:.15s;}
.srv-card:nth-child(4){animation-delay:.2s;}
.srv-card:nth-child(5){animation-delay:.25s;}
.srv-card:nth-child(6){animation-delay:.3s;}
.srv-card:nth-child(7){animation-delay:.35s;}

/* Hover shimmer line */
.srv-card::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);transition:left .5s ease;pointer-events:none;}
.srv-card:hover::before{left:150%;}

/* Color accent top bar */
.srv-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--card-accent,var(--accent));transform:scaleX(0);transform-origin:left;transition:transform .4s ease;}
.srv-card:hover::after{transform:scaleX(1);}
.srv-card:hover{background:var(--surface2);}

.srv-num{font-family:var(--font-m);font-size:10px;color:var(--text-muted);letter-spacing:.1em;position:absolute;top:36px;right:36px;transition:color .3s;}
.srv-card:hover .srv-num{color:var(--card-accent,var(--accent));}
.srv-icon-wrap{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--surface2);border:1px solid var(--border);margin-bottom:22px;transition:background .3s,border-color .3s,transform .4s;}
.srv-card:hover .srv-icon-wrap{background:var(--surface3);border-color:var(--border2);transform:scale(1.1) rotate(-4deg);}
.srv-card h3{font-size:17px;font-weight:700;margin-bottom:10px;letter-spacing:-.01em;transition:color .3s;}
.srv-card:hover h3{color:var(--card-accent,var(--accent));}
.srv-card p{font-family:var(--font-m);font-size:12px;color:var(--text-muted);line-height:1.75;margin-bottom:18px;}
.srv-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.srv-tag{font-family:var(--font-m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);border:1px solid var(--border);padding:3px 9px;transition:border-color .3s,color .3s;}
.srv-card:hover .srv-tag{border-color:rgba(255,69,0,.25);color:var(--text-dim);}

/* Click prompt */
.srv-click{font-family:var(--font-m);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;}
.srv-click::before{content:'';display:block;width:16px;height:1px;background:var(--card-accent,var(--accent));}
.srv-card:hover .srv-click{opacity:1;transform:translateY(0);}

/* Wide card (last row) */
.srv-card.wide{grid-column:span 3;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;}
.srv-card.wide .srv-right{display:flex;flex-direction:column;gap:16px;}
.srv-card.wide .srv-features{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.srv-feature{display:flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:12px;color:var(--text-dim);}
.srv-feature::before{content:'→';color:var(--accent);flex-shrink:0;}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .35s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border:1px solid var(--border2);max-width:680px;width:100%;max-height:85vh;overflow-y:auto;position:relative;transform:translateY(30px) scale(.97);transition:transform .35s ease;scrollbar-width:none;}
.modal-overlay.open .modal{transform:translateY(0) scale(1);}
.modal::-webkit-scrollbar{display:none;}
.modal-close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:16px 20px;background:var(--surface);z-index:1;}
.modal-close-btn{width:36px;height:36px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s;}
.modal-close-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.modal-body{padding:8px 44px 44px;}
.modal-accent-bar{height:3px;background:linear-gradient(90deg,var(--modal-color,var(--accent)),transparent);margin-bottom:32px;}
.modal-icon{font-size:44px;margin-bottom:20px;}
.modal h3{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px;}
.modal-desc{font-family:var(--font-m);font-size:13px;color:var(--text-dim);line-height:1.85;margin-bottom:28px;}
.modal-section-title{font-family:var(--font-m);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;}
.modal-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
.modal-list-item{display:flex;align-items:flex-start;gap:12px;font-family:var(--font-m);font-size:13px;color:var(--text-dim);line-height:1.6;}
.modal-bullet{width:18px;height:18px;background:rgba(255,69,0,.12);border:1px solid rgba(255,69,0,.25);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--accent);flex-shrink:0;margin-top:1px;}
.modal-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px;}
.modal-tag{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--border2);color:var(--text-dim);}
.modal-cta{display:flex;gap:12px;flex-wrap:wrap;}

/* ===== ABOUT ===== */
#about{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:start;}
.about-card{background:var(--bg);border:1px solid var(--border);padding:44px 36px;position:relative;overflow:hidden;}
.about-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.big-initials{font-size:130px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.05);position:absolute;bottom:-20px;right:-8px;letter-spacing:-.05em;pointer-events:none;user-select:none;}
.avail-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#22c55e;border:1px solid rgba(34,197,94,.25);padding:7px 14px;margin-bottom:28px;}
.open-days{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent2);border:1px solid rgba(0,212,255,.2);padding:7px 14px;margin-bottom:24px;margin-left:8px;}
.about-name{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;}
.about-role{font-family:var(--font-m);font-size:12px;color:var(--text-muted);margin-bottom:32px;}
.about-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-top:1px solid var(--border);}
.stat-box{background:var(--bg);padding:20px 18px;}
.stat-n{font-size:30px;font-weight:800;color:var(--accent);letter-spacing:-.03em;line-height:1;}
.stat-l{font-family:var(--font-m);font-size:10px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;}
.about-text h2{margin-bottom:26px;}
.about-text p{font-family:var(--font-m);font-size:13px;color:var(--text-dim);line-height:1.9;margin-bottom:18px;}
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px;}
.skill-chip{display:flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:11px;color:var(--text-dim);padding:9px 14px;border:1px solid var(--border);transition:border-color .3s,color .3s;}
.skill-chip:hover{border-color:rgba(255,69,0,.3);color:var(--text);}
.skill-chip::before{content:'◈';color:var(--accent);font-size:9px;}

/* ===== CONTACT ===== */
#contact{background:var(--bg);}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:72px;}
.contact-info h2{margin-bottom:20px;}
.contact-info>p{font-family:var(--font-m);font-size:13px;color:var(--text-dim);line-height:1.9;margin-bottom:40px;}
.contact-cards{display:flex;flex-direction:column;gap:14px;}
.contact-card{display:flex;align-items:center;gap:18px;padding:18px 22px;border:1px solid var(--border);transition:border-color .35s,background .35s;text-decoration:none;cursor:pointer;}
.contact-card:hover{border-color:var(--card-border,rgba(255,69,0,.3));background:var(--surface2);}
.cc-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;transition:transform .3s;}
.contact-card:hover .cc-icon{transform:scale(1.1);}
.cc-label{font-family:var(--font-m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px;}
.cc-value{font-size:15px;font-weight:600;color:var(--text);}
.cc-sub{font-family:var(--font-m);font-size:11px;color:var(--text-muted);margin-top:2px;}

/* FORM */
.form-wrap{display:flex;flex-direction:column;gap:18px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.fg{display:flex;flex-direction:column;gap:7px;}
.fl{font-family:var(--font-m);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);}
.fi,.ft{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-m);font-size:13px;padding:14px 18px;outline:none;transition:border-color .3s;width:100%;}
.fi:focus,.ft:focus{border-color:var(--accent);}
.fi::placeholder,.ft::placeholder{color:var(--text-muted);}
.ft{min-height:110px;resize:none;}
.form-btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;}

/* BTN SYSTEM */
.btn{padding:14px 30px;font-family:var(--font-d);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:none;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));transition:transform .2s,filter .2s;position:relative;overflow:hidden;}
.btn::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.12);transform:translateX(-100%);transition:transform .3s;}
.btn:hover::before{transform:translateX(0);}
.btn:hover{transform:translateY(-2px);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-green{background:#25D366;color:#fff;}
.btn-blue{background:var(--accent2);color:#080808;}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border2);clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:36px 52px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;background:var(--surface);}
.foot-brand{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;}
.foot-brand span{color:var(--accent);}
.foot-copy{font-family:var(--font-m);font-size:11px;color:var(--text-muted);text-align:center;}
.foot-links{display:flex;gap:22px;}
.foot-links a{font-family:var(--font-m);font-size:10px;color:var(--text-muted);text-decoration:none;letter-spacing:.12em;text-transform:uppercase;transition:color .3s;}
.foot-links a:hover{color:var(--accent);}

/* REVEAL */
.reveal{opacity:0;transform:translateY(36px);transition:opacity .75s ease,transform .75s ease;}
.reveal.on{opacity:1;transform:translateY(0);}

/* RESPONSIVE */
@media(max-width:960px){
  nav{padding:18px 22px;}
  .nav-links{display:none;}
  #hero,section{padding:80px 22px;}
  #hero{padding-top:100px;}
  .srv-grid{grid-template-columns:1fr;}
  .srv-card.wide{grid-column:sp
